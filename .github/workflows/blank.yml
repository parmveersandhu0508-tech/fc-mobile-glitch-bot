
name: FC Mobile Glitch Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Get bot code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run glitch monitor
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GLITCH_ROLE_ID: ${{ secrets.GLITCH_ROLE_ID }}
        run: python bot.py

      - name: Save seen reports
        run: |
          git config user.name "FC Mobile Bot"
          git config user.email "bot@example.com"
          git add seen.json
          git commit -m "Update seen reports" || echo "No changes"
          git push
